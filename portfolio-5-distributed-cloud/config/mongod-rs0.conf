# =====================================================================
# Portfolio 5 - MongoDB replica set rs0 member (YAML config file).
# The scripts start mongod with command-line flags; this file is the
# equivalent configuration. Three members run on ports 27017, 27018, 27019,
# each with its own dbPath and log file:
#   mongod --replSet rs0 --port <port> --bind_ip localhost \
#          --dbpath <dir>/rs0-<port> --logpath <logdir>/rs0-<port>.log \
#          --wiredTigerCacheSizeGB 0.5
# Replica set settings used by the election demo are the defaults:
#   electionTimeoutMillis = 10000, heartbeatIntervalMillis = 2000
# =====================================================================
net:
  port: 27018                 # 27017 / 27018 / 27019
  bindIp: localhost
storage:
  dbPath: /var/lib/mongo-work/rs0-27018
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  path: /var/log/mongo-work/rs0-27018.log
  logAppend: true
replication:
  replSetName: rs0
