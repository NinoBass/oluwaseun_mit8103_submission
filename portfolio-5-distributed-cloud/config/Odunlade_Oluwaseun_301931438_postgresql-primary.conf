# =====================================================================
# Portfolio 5 - PostgreSQL 16 PRIMARY (port 5432): settings this portfolio relies on.
# Append to the primary's postgresql.conf, then restart. Portfolios 1-4 use the
# same server. Values match the scripts and the READMEs (Portfolio 2 environment line).
# =====================================================================
port                    = 5432
listen_addresses        = 'localhost'

# --- memory (Portfolio 2 benchmark environment) ---------------------
shared_buffers          = 512MB
#work_mem               = 4MB          # left at the default in the final run

# --- streaming replication (Portfolio 5, section 1) -----------------
wal_level               = replica      # WAL contains enough to rebuild a physical copy
max_wal_senders         = 10           # one per standby / pg_basebackup stream
hot_standby             = on           # copied to the standby by pg_basebackup: read-only queries allowed
wal_log_hints           = on           # required by pg_rewind (rejoining the old primary after failover)
wal_keep_size           = '2GB'        # keep enough WAL for pg_rewind; the first failover failed without it
                                       # (set with ALTER SYSTEM in the original run; listed here for completeness)
synchronous_standby_names = ''         # asynchronous by default; Odunlade_Oluwaseun_301931438_02_replication_demo.py switches it to
                                       # 'standby1' (with ALTER SYSTEM + pg_reload_conf) to measure sync mode

# --- concurrency demos (Portfolio 3) ---------------------------------
deadlock_timeout        = 1s           # D4: the deadlock is detected after this wait
log_lock_waits          = on           # log any lock wait longer than deadlock_timeout

# The database-level time zone is set by portfolio-1-database-design/sql/Odunlade_Oluwaseun_301931438_01_schema.sql:
#   ALTER DATABASE seunbaba SET timezone = 'Africa/Lagos';
