# =====================================================================
# Portfolio 5 - PostgreSQL 16 HOT STANDBY (port 5433).
# Written by `pg_basebackup -R -S standby1` in replication/Odunlade_Oluwaseun_301931438_01_setup_standby.sh
# (see evidence/Odunlade_Oluwaseun_301931438_R1_setup_standby.txt for the file as generated), plus the port
# override the script appends to postgresql.conf. `-R` also creates the empty
# file standby.signal, which makes the copy start in recovery (standby) mode.
# Connection options that pg_basebackup adds by default (sslmode, passfile, ...)
# are omitted here.
# =====================================================================
primary_conninfo  = 'host=localhost port=5432 user=postgres application_name=standby1'
primary_slot_name = 'standby1'      # physical slot: the primary keeps WAL until the standby has it

# appended to postgresql.conf by the setup script
port = 5433
