# =====================================================================
# Portfolio 5 - PostgreSQL 16 SHARD servers (ports 5434 and 5435).
# Each shard is a separate cluster (initdb), holding database seunbaba_shard
# with the tables from sharding/01_shard_node.sql. The coordinator (port 5432)
# reaches them through postgres_fdw (sharding/02_coordinator.sql).
# Append to each shard's postgresql.conf; use port 5435 on the second shard.
# =====================================================================
port              = 5434              # 5435 on shard 2
listen_addresses  = 'localhost'
shared_buffers    = 128MB             # shards hold ~55k orders each
timezone          = 'Africa/Lagos'    # same reporting time zone as the primary
