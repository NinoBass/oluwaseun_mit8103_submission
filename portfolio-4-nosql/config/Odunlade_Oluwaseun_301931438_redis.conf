# =====================================================================
# Portfolio 4 - Redis server used by redis/Odunlade_Oluwaseun_301931438_redis_demo.py.
# Equivalent of: redis-server --port 6379 --daemonize yes --save "" --appendonly no
# Persistence is deliberately OFF: Redis is a cache / admission gate here, and
# PostgreSQL remains the system of record (see README section 3).
# =====================================================================
port 6379
bind 127.0.0.1
daemonize yes
save ""            # no RDB snapshots
appendonly no      # no append-only file
